name: Refresh data and deploy site

on:
  schedule:
    - cron: "30 6 * * 2-6"   # 06:30 UTC Tue-Sat, after each US trading day
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Download prices, run quality gates, export data
        # Exits non-zero if a hard quality check fails; the deploy is then skipped and the
        # previously published site stays live.
        run: python -m pipeline.refresh --db data/portfolio.db --out _site/data
      - name: Assemble site
        run: python -m pipeline.build_site --out _site
      - name: Smoke-test the engine on the exported data
        run: python -m pipeline.smoke_test _site/data/prices.csv
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
